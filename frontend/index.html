<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MindVault AI - Secure Personal Journal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    // 1. YOUR FIREBASE CONFIG (Step 5 से निकाली वैल्यूज यहाँ भरें)
    const firebaseConfig = {
  apiKey: "AIzaSyB75eWoTAsWouleOLM6hmLsFEjgkjRrnlA",
  authDomain: "mindvault-ai-5ed2f.firebaseapp.com",
  projectId: "mindvault-ai-5ed2f",
  storageBucket: "mindvault-ai-5ed2f.firebasestorage.app",
  messagingSenderId: "738749719266",
  appId: "1:738749719266:web:00da397f13496104ce74bb"
};
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    let currentUser = null;
    let idToken = null;

    // Elements
    const authSection = document.getElementById("auth-section");
    const appSection = document.getElementById("app-section");
    const loginBtn = document.getElementById("login-btn");
    const logoutBtn = document.getElementById("logout-btn");
    const userEmailSpan = document.getElementById("user-email");

    // Auth Listeners
    loginBtn.addEventListener("click", async () => {
      try {
        await signInWithPopup(auth, provider);
      } catch (err) {
        alert("Login Failed: " + err.message);
      }
    });

    logoutBtn.addEventListener("click", () => signOut(auth));

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
        idToken = await user.getIdToken();
        userEmailSpan.textContent = user.email;
        authSection.classList.add("hidden");
        appSection.classList.remove("hidden");
        loadJournals();
      } else {
        currentUser = null;
        idToken = null;
        authSection.classList.remove("hidden");
        appSection.classList.add("hidden");
      }
    });

    // Journal Submission
    document.getElementById("save-journal-btn").addEventListener("click", async () => {
      const title = document.getElementById("journal-title").value.trim();
      const content = document.getElementById("journal-content").value.trim();
      const status = document.getElementById("journal-status");

      if (!title || !content) {
        alert("Please fill in both title and content!");
        return;
      }

      status.textContent = "AI analyzing and securing entry...";
      try {
        const res = await fetch("/api/journal", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${idToken}`
          },
          body: JSON.stringify({ title, content })
        });
        const data = await res.json();
        status.textContent = `Saved! Reflection: ${data.reflectionLabel}`;
        document.getElementById("journal-title").value = "";
        document.getElementById("journal-content").value = "";
        loadJournals();
      } catch (e) {
        status.textContent = "Failed to save.";
      }
    });

    // Load Entries
    async function loadJournals() {
      const listContainer = document.getElementById("journal-list");
      listContainer.innerHTML = "Loading...";
      try {
        const res = await fetch("/api/journal", {
          headers: { "Authorization": `Bearer ${idToken}` }
        });
        const data = await res.json();
        listContainer.innerHTML = "";
        data.entries.forEach(e => {
          const card = document.createElement("div");
          card.className = "p-4 bg-gray-800 rounded-lg border border-gray-700 space-y-2";
          card.innerHTML = `
            <div class="flex justify-between items-center">
              <h4 class="font-bold text-lg text-indigo-400">${e.title}</h4>
              <span class="text-xs px-2 py-1 bg-indigo-950 text-indigo-300 rounded border border-indigo-700">${e.reflectionLabel}</span>
            </div>
            <p class="text-gray-300 text-sm">${e.content}</p>
            <div class="text-xs text-gray-400 bg-gray-900 p-2 rounded border border-gray-800">
              <strong>AI Summary:</strong> ${e.summary}
            </div>
          `;
          listContainer.appendChild(card);
        });
      } catch (err) {
        listContainer.innerHTML = "Failed to load entries.";
      }
    }

    // Chat with Gemini
    let conversationId = null;
    document.getElementById("send-chat-btn").addEventListener("click", async () => {
      const input = document.getElementById("chat-input");
      const msg = input.value.trim();
      const chatBox = document.getElementById("chat-box");
      const memoryOpt = document.getElementById("memory-opt").checked;

      if (!msg) return;

      chatBox.innerHTML += `<div class="text-right"><span class="bg-indigo-600 text-white text-sm px-3 py-1.5 rounded-lg inline-block my-1">${msg}</span></div>`;
      input.value = "";

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${idToken}`
          },
          body: JSON.stringify({ conversation_id: conversationId, message: msg, enable_memory: memoryOpt })
        });
        const data = await res.json();
        conversationId = data.conversation_id;
        chatBox.innerHTML += `<div class="text-left"><span class="bg-gray-700 text-gray-200 text-sm px-3 py-1.5 rounded-lg inline-block my-1">${data.reply}</span></div>`;
        chatBox.scrollTop = chatBox.scrollHeight;
      } catch (e) {
        chatBox.innerHTML += `<div class="text-center text-red-400 text-xs my-1">Failed to get response</div>`;
      }
    });

    // Privacy Wipe
    document.getElementById("wipe-btn").addEventListener("click", async () => {
      if (!confirm("Are you sure you want to permanently delete all your journal entries and conversations?")) return;
      try {
        await fetch("/api/privacy/clear-all", {
          method: "DELETE",
          headers: { "Authorization": `Bearer ${idToken}` }
        });
        alert("All personal data wiped!");
        loadJournals();
      } catch (e) {
        alert("Wipe failed.");
      }
    });
  </script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen">
  <!-- Navbar -->
  <header class="border-b border-gray-800 p-4 flex justify-between items-center max-w-6xl mx-auto">
    <h1 class="text-xl font-bold bg-gradient-to-r from-indigo-400 to-purple-400 bg-clip-text text-transparent">MindVault AI</h1>
    <div>
      <span id="user-email" class="text-sm text-gray-400 mr-4"></span>
      <button id="logout-btn" class="text-sm bg-gray-800 hover:bg-gray-700 px-3 py-1 rounded">Logout</button>
    </div>
  </header>

  <!-- Login Landing View -->
  <div id="auth-section" class="max-w-md mx-auto mt-20 p-6 bg-gray-900 border border-gray-800 rounded-xl text-center space-y-4">
    <h2 class="text-2xl font-semibold">Secure Personal Journal</h2>
    <p class="text-gray-400 text-sm">Empathetic AI reflection with strict tenant-isolated Firestore and zero key exposure.</p>
    <button id="login-btn" class="w-full bg-indigo-600 hover:bg-indigo-500 py-2.5 rounded-lg font-medium">Sign In with Google</button>
  </div>

  <!-- App Dashboard -->
  <main id="app-section" class="hidden max-w-6xl mx-auto p-4 grid grid-cols-1 md:grid-cols-2 gap-6 mt-4">
    <!-- Left Column: Journal & History -->
    <div class="space-y-6">
      <div class="p-4 bg-gray-900 border border-gray-800 rounded-xl space-y-3">
        <h3 class="font-semibold text-gray-200">New Journal Entry</h3>
        <input id="journal-title" class="w-full bg-gray-950 border border-gray-700 rounded p-2 text-sm" placeholder="Title...">
        <textarea id="journal-content" rows="4" class="w-full bg-gray-950 border border-gray-700 rounded p-2 text-sm" placeholder="Write your thoughts..."></textarea>
        <div class="flex justify-between items-center">
          <button id="save-journal-btn" class="bg-indigo-600 hover:bg-indigo-500 px-4 py-1.5 rounded text-sm font-medium">Save & Reflect</button>
          <span id="journal-status" class="text-xs text-gray-400"></span>
        </div>
      </div>

      <div class="space-y-3">
        <h3 class="font-semibold text-gray-300">Your Journal Stream</h3>
        <div id="journal-list" class="space-y-3 max-h-[400px] overflow-y-auto"></div>
      </div>
    </div>

    <!-- Right Column: Gemini Chat & Privacy -->
    <div class="space-y-6">
      <div class="p-4 bg-gray-900 border border-gray-800 rounded-xl flex flex-col h-[450px]">
        <div class="flex justify-between items-center mb-2 pb-2 border-b border-gray-800">
          <h3 class="font-semibold text-gray-200">AI Partner Chat</h3>
          <label class="text-xs text-gray-400 flex items-center space-x-1">
            <input type="checkbox" id="memory-opt" class="rounded bg-gray-800">
            <span>AI Memory</span>
          </label>
        </div>
        <div id="chat-box" class="flex-1 overflow-y-auto space-y-2 p-2 bg-gray-950 rounded border border-gray-800 mb-3"></div>
        <div class="flex space-x-2">
          <input id="chat-input" class="flex-1 bg-gray-950 border border-gray-700 rounded px-3 py-1.5 text-sm" placeholder="Discuss your reflections...">
          <button id="send-chat-btn" class="bg-purple-600 hover:bg-purple-500 px-4 py-1.5 rounded text-sm font-medium">Send</button>
        </div>
      </div>

      <!-- Privacy Center -->
      <div class="p-4 bg-red-950/20 border border-red-900/40 rounded-xl space-y-2">
        <h4 class="text-red-300 text-sm font-semibold">Privacy Center</h4>
        <p class="text-xs text-gray-400">You own your data. Permanently delete all entries and conversations anytime.</p>
        <button id="wipe-btn" class="text-xs bg-red-800/60 hover:bg-red-700 text-red-100 px-3 py-1.5 rounded">Erase All My Data</button>
      </div>
    </div>
  </main>
</body>
</html>
